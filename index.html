<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rent Tracker</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2E4BC6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rent Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
/* Layout: desktop app shell. Left sidebar (buildings + sections), top bar with month, content area, right-side drawer for details and forms. */
:root{
  --bg:#F4F5F8; --surface:#FFFFFF; --sunk:#F0F2F6; --side:#EBEEF4; --ink:#141B2D; --muted:#5F6B7F; --faint:#8A94A6; --line:#E1E5EC;
  --accent:#2448C6; --accent-ink:#FFFFFF; --accent-soft:#E7ECFB;
  --lp:#2448C6; --osb:#0B7A63;
  --paid:#11734B; --paid-bg:#E1F4EA; --part:#9A5B00; --part-bg:#FCEFD6;
  --over:#B4261E; --over-bg:#FCE6E4; --up:#3A4A6B; --up-bg:#EDF0F6; --vac:#6B7486; --vac-bg:#EEF0F3;
  --shadow:0 1px 2px rgba(20,27,45,.06),0 4px 16px rgba(20,27,45,.06);
  --font:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --display:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#10141C; --surface:#171C26; --sunk:#1D2330; --side:#141924; --ink:#E9EDF4; --muted:#A1AABB; --faint:#7B8597; --line:#2A3140;
  --accent:#7E9BFF; --accent-ink:#0D1530; --accent-soft:#1F2A4A;
  --lp:#7E9BFF; --osb:#3CC7A2;
  --paid:#4ED19A; --paid-bg:#143326; --part:#F0B65A; --part-bg:#352812;
  --over:#FF8A80; --over-bg:#3D1C1A; --up:#B9C4DA; --up-bg:#232A38; --vac:#9AA3B3; --vac-bg:#232832;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
a{color:var(--accent)}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);height:100%}
.side{background:var(--side);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:18px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px}
.logo{width:34px;height:34px;border-radius:9px;overflow:hidden;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:15px;letter-spacing:-.02em}
.brand b{display:block;font-family:var(--display);font-size:16px;letter-spacing:-.01em}
.brand span{font-size:11.5px;color:var(--muted)}
.nav{display:grid;gap:2px}
.nav-label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:0 10px 4px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:8px;text-align:left;font-weight:500;color:var(--ink)}
.nav button:hover{background:color-mix(in srgb, var(--ink) 6%, transparent)}
.nav button[aria-current="page"]{background:var(--surface);box-shadow:var(--shadow);font-weight:600}
.nav svg{width:18px;height:18px;flex:none;color:var(--muted)}
.nav .bdot{width:10px;height:10px;border-radius:3px;flex:none}
.nav .count{margin-left:auto;font-size:12px;color:var(--faint);font-weight:500}
.nav .count.alert{color:var(--over);font-weight:700}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 10px;display:grid;gap:8px}
.side-foot button{justify-self:start}
.terms{margin:6px 0 4px;padding:10px 12px 10px 30px;max-height:220px;overflow-y:auto;background:var(--sunk);border:1px solid var(--line);border-radius:10px;font-size:13px;line-height:1.5;display:grid;gap:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg-b{border:0;background:none;font:inherit;font-size:12.5px;font-weight:600;padding:5px 12px;color:var(--muted)}
.seg-b.on{background:var(--accent);color:#fff}
.verbtn{padding:0;font-size:12px;font-weight:600;color:var(--muted);text-align:left}
.verbtn:hover{color:var(--accent)}

.main{display:flex;flex-direction:column;min-width:0;height:100%}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 28px;border-bottom:1px solid var(--line);background:var(--surface)}
.topbar h1{margin:0;font-family:var(--display);font-size:21px;font-weight:700;letter-spacing:-.02em}
.topbar .sub{font-size:12.5px;color:var(--muted)}
.month{display:flex;align-items:center;gap:4px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px}
.month button{border:0;background:none;width:30px;height:30px;border-radius:7px;font-size:17px;color:var(--muted)}
.month button:hover{background:var(--surface);color:var(--ink)}
.month span{min-width:110px;text-align:center;font-weight:600}
.content{flex:1;overflow-y:auto;padding:24px 28px 48px}
.wrap{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
.wrap > *{min-width:0}
.bgrid > *,.hero > *{min-width:0}

h2{margin:0;font-family:var(--display);font-size:16px;font-weight:700;letter-spacing:-.01em}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.muted{color:var(--muted)} .small{font-size:12.5px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.hero{padding:20px 22px;display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:20px}
.hero .k{font-size:12px;color:var(--muted);font-weight:500}
.hero .v{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.hero .v small{font-family:var(--font);font-size:13px;color:var(--muted);font-weight:500;letter-spacing:0}
.bar{height:6px;border-radius:9px;background:var(--sunk);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--paid);border-radius:9px}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bcard{padding:16px 18px;display:grid;gap:10px;text-align:left;width:100%;font:inherit;color:inherit}
button.bcard:hover{border-color:color-mix(in srgb, var(--accent) 35%, var(--line))}
.bcard h3{margin:0;font-family:var(--display);font-size:15px;display:flex;align-items:center;gap:8px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.kv > span:first-child{color:var(--muted)}
.kv b{font-weight:600;text-align:right}

.table{width:100%;border-collapse:collapse}
.table th{font-size:11.5px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
.table td{padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table tbody tr.click{cursor:pointer}
.table tbody tr.click:hover td{background:var(--sunk)}
.table .num{text-align:right;white-space:nowrap}
.tscroll{overflow-x:auto}
.flatno{display:inline-grid;place-items:center;min-width:34px;height:26px;padding:0 7px;border-radius:7px;background:var(--sunk);font-weight:700;font-size:12.5px}
.tname{font-weight:600}
.show-sm{display:none}
.disc{display:inline-block;font-size:11px;font-weight:600;color:var(--part);background:var(--part-bg);padding:1px 7px;border-radius:99px;white-space:nowrap;vertical-align:middle;margin-left:4px}
.tsearch{min-width:min(260px,100%)}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink);width:max-content;max-width:100%}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw-t{position:relative;width:36px;height:20px;border-radius:999px;background:var(--line);flex:none;transition:background .15s}
.sw-t::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.sw input:checked+.sw-t{background:var(--accent)}
.sw input:checked+.sw-t::after{transform:translateX(16px)}
.sw input:focus-visible+.sw-t{outline:2px solid var(--accent);outline-offset:2px}
.chk{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.chk,.field .chk{display:flex;justify-content:flex-start;align-items:center;gap:7px;width:max-content;max-width:100%}
.chk input,.field .chk input{width:16px!important;height:16px;min-width:0;margin:0;padding:0!important;border:0;accent-color:var(--accent);flex:none}
.tpage{min-height:100%;background:var(--bg)}
.tbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));background:var(--surface);border-bottom:1px solid var(--line)}
.tbar .brand{padding:0}
.twrap{max-width:760px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:grid;gap:18px}
.thero{padding:20px 22px;display:grid;gap:6px}
.thero .v{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:-.02em}
.twrap{grid-template-columns:minmax(0,1fr)} .twrap > *{min-width:0}
.tbar .brand > div:last-child,.tbar .brand span{display:block!important}
.bill{display:grid;gap:4px;padding:14px 16px;border-top:1px solid var(--line)}
.bill:first-child{border-top:0}
.bill .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bill .row{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--muted)}
.bill .row b{color:var(--ink);font-weight:600}
.aad{position:relative;display:block;border:1.5px dashed color-mix(in srgb, var(--accent) 45%, var(--line));border-radius:10px;background:var(--accent-soft);min-height:96px;cursor:pointer;overflow:hidden}
.aad input{position:absolute;inset:0;opacity:0;cursor:pointer}
.aad-ph{display:grid;place-items:center;text-align:center;min-height:96px;font-weight:600;font-size:13px;color:var(--accent);padding:8px}
.aad-ph small{font-weight:500;color:var(--muted)}
.aad img{display:block;width:100%;height:96px;object-fit:cover}
.viewer .pair{display:grid;gap:12px;max-height:100%;overflow:auto;max-width:min(720px,100%)}
.viewer .pair img{max-height:none;width:100%}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:4px;cursor:pointer}
.elec{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-weight:500;color:var(--muted);white-space:nowrap}
td .elec{display:flex;justify-content:flex-end;margin-top:3px}
.elec input{width:16px;height:16px;accent-color:var(--paid);cursor:pointer;margin:0}
.elec:has(input:checked){color:var(--paid);font-weight:600}
.vacant-t{color:var(--faint);font-style:italic}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.stack>*{min-width:0}
.li .main{min-width:0}
.ptag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;margin:3px 0 0 4px;white-space:nowrap}
.pt-rent{background:var(--accent-soft);color:var(--accent)}
.pt-elec{background:var(--part-bg);color:var(--part)}
.pt-oth{background:rgba(124,77,214,.14);color:#7C4DD6}
.spills{display:inline-flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
details.adv{border:1px solid var(--line);border-radius:12px;padding:0 16px}
details.adv>summary{cursor:pointer;padding:12px 0;font-weight:600;list-style:none}
details.adv>summary::-webkit-details-marker{display:none}
details.adv>summary::before{content:"▸ ";color:var(--muted)}
details.adv[open]>summary::before{content:"▾ "}
details.adv>.advin{display:grid;gap:12px;padding:0 0 16px}
details.danger{border-color:var(--over-bg)}
details.danger>summary{color:var(--over)}
.ddot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--part);margin-left:6px;vertical-align:middle;cursor:help}
.kv.miss{background:var(--over-bg)}
.kv.miss > span:first-child, .kv.miss b{color:var(--over)}
.kv.miss b{white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;gap:4px}
.kv.miss b .linkbtn{display:inline;width:auto;padding:0;white-space:nowrap}
.ibtn{border:0;background:none;padding:0 2px;margin-left:4px;color:inherit;cursor:pointer;font:inherit;font-size:14px;line-height:1;vertical-align:middle;opacity:.9}
.ibtn.sm{font-size:12px;opacity:.6}
.napop{margin:0 14px 10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card,#fff);font-size:13px;display:grid;gap:8px;max-width:320px}
.alertbar{background:var(--over-bg);color:var(--over);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
.rdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--over);margin-left:6px;vertical-align:middle;cursor:help}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-paid{background:var(--paid-bg);color:var(--paid)}
.p-partial{background:var(--part-bg);color:var(--part)}
.p-overdue{background:var(--over-bg);color:var(--over)}
.p-upcoming{background:var(--up-bg);color:var(--up)}
.p-vacant,.p-ns,.p-closed{background:var(--vac-bg);color:var(--vac)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.danger{color:var(--over)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--sunk)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.tabs{display:flex;gap:4px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px;width:max-content;max-width:100%;overflow-x:auto}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:7px;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.banner{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 16px;border-radius:10px;background:var(--part-bg);color:var(--ink);border:1px solid color-mix(in srgb, var(--part) 30%, transparent)}
.banner.info{background:var(--accent-soft);border-color:color-mix(in srgb, var(--accent) 25%, transparent)}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* Drawer */
/* motion: springs (critically damped, response ~0.35s), interruptible transitions */
:root{--spring:cubic-bezier(.22,1,.36,1);--spring-soft:cubic-bezier(.32,.72,0,1)}
.scrim{position:fixed;inset:0;background:rgba(10,14,24,.42);z-index:20;display:flex;justify-content:center;align-items:center;padding:24px;transition:background-color .3s var(--spring)}
.scrim.off{background:rgba(10,14,24,0)}
.scrim.closing{pointer-events:none}
.drawer{width:min(680px,100%);max-height:min(92vh,100%);background:var(--surface);border-radius:18px;box-shadow:0 24px 64px rgba(0,0,0,.28);overflow-y:auto;padding:22px 26px 32px;transition:transform .34s var(--spring),opacity .22s ease;will-change:transform;overscroll-behavior:contain}
.drawer.off{transform:translateY(18px) scale(.97);opacity:0}
@media (max-width:640px){ .scrim{align-items:flex-end;padding:0} .drawer{width:100%;max-height:94vh;border-radius:18px 18px 0 0} .drawer.off{transform:translateY(100%);opacity:1} }
.drawer.dragging{transition:none}
/* respond on press, not on release */
.btn,.nav button,.tabs button,.chips label span,.linkbtn,.aad,.thumb{transition:transform .1s ease-out,background-color .15s ease}
.btn:active:not(:disabled),.nav button:active,.tabs button:active,.chips label:active span,.linkbtn:active,.aad:active,.thumb:active{transform:scale(.97)}
.table tbody tr.click:active td,.li.click:active,.list .li[data-open]:active{background:var(--sunk)}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
html,body{overscroll-behavior:none}
.content,.drawer{overscroll-behavior:contain}
.tscroll,.bchips{overscroll-behavior-x:contain;overscroll-behavior-y:auto}
@media (min-width:761px){.content{overscroll-behavior:auto}}
.bchips,.tabbar,.fab{display:none}
@media (max-width:760px){
  .side{display:none}
  .app{grid-template-rows:minmax(0,1fr)!important;height:100%}
  .bchips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 2px;background:var(--surface);scrollbar-width:none}
  .bchips::-webkit-scrollbar{display:none}
  .bchip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap}
  .bchip[aria-current]{background:var(--accent);border-color:var(--accent);color:#fff}
  .bchip .bdot{width:8px;height:8px}
  .bchip .n{background:var(--over);color:#fff;border-radius:999px;font-size:11px;padding:1px 6px}
  .topbar{border-bottom:0}
  .content{padding:12px 14px calc(110px + env(safe-area-inset-bottom))!important}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(8px + env(safe-area-inset-bottom))}
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;font:inherit;font-size:10.5px;font-weight:600;color:var(--muted);padding:4px 0}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button[aria-current]{color:var(--accent)}
  .fab{display:none!important}
  .tabbar .tplus{color:var(--accent)}
  .tabbar .tplus .pc{width:52px;height:52px;margin-top:-26px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:400;line-height:1;box-shadow:0 6px 16px rgba(20,40,120,.3);border:4px solid var(--surface)}
  .toast{bottom:calc(96px + env(safe-area-inset-bottom))}
  input,select,textarea{font-size:16px!important}
  .table.cards,.table.cards tbody{display:block}
  .table.cards thead{display:none}
  .table.cards tr{display:flex;flex-wrap:wrap;align-items:baseline;row-gap:3px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .table.cards tr:last-child{border-bottom:0}
  .table.cards tr::before{content:"";order:2;flex-basis:100%;height:0}
  .table.cards td{padding:0;border:0;background:none!important}
  .table.cards td:first-child{order:0;flex:1 1 auto;min-width:0;font-weight:600;font-size:15px;color:var(--ink)}
  .table.cards td:last-child{order:1;margin-left:auto;padding-left:10px;text-align:right;font-weight:600}
  .table.cards td:not(:first-child):not(:last-child){order:3;font-size:12.5px;color:var(--muted);text-align:left;margin-right:14px}
  .table.cards td.hide-sm{display:none}
  .table.cards .tname{font-weight:600;color:var(--ink);font-size:14.5px}
  .table.cards tr:has(td:first-child .flatno) td:first-child{flex:0 0 auto;margin-right:10px}
  .table.cards tr:has(td:first-child .flatno) td:nth-child(2):not(:last-child){order:0;flex:1 1 auto;font-size:14.5px;color:var(--ink)}
  .table.cards .num b{font-size:14px}
  .table.cards tr.click:active{background:var(--sunk)}

const meterPrevAuto = (u,ym) => { const all=Object.keys(u.meter||{}).filter(m=>u.meter[m]!==""&&u.meter[m]!=null).sort(), ks=all.filter(m=>m<ym);
  if(ks.length) return +u.meter[ks[ks.length-1]];
  if(u.meterStart==null||u.meterStart==="") return null;

// Touch screens: only real scroll areas may scroll. Stops the whole page sliding up (and the tab bar with it).
(function(){
  if(!("ontouchstart" in window)) return;
  let sx=0, sy=0;
  const canScroll=(el,ax)=>{ const st=getComputedStyle(el), ov=ax==="y"?st.overflowY:st.overflowX; return /(auto|scroll)/.test(ov) && (ax==="y"?el.scrollHeight>el.clientHeight+1:el.scrollWidth>el.clientWidth+1); };
  document.addEventListener("touchstart",e=>{ const t=e.touches[0]; if(t){ sx=t.clientX; sy=t.clientY; } },{passive:true});
  const phone=window.matchMedia?matchMedia("(max-width:760px)"):{matches:true};
  document.addEventListener("touchmove",e=>{
    if(!e.cancelable) return;
    if(e.touches.length>1){ e.preventDefault(); return; }
    if(!phone.matches) return;
    const t=e.touches[0]; if(!t) return;
    const dx=t.clientX-sx, dy=t.clientY-sy, ax=Math.abs(dx)>Math.abs(dy)?"x":"y";
    for(let el=e.target; el && el!==document.body && el!==document.documentElement; el=el.parentElement){
      if(el.tagName==="INPUT"||el.tagName==="TEXTAREA"||el.tagName==="SELECT") return;
      if(canScroll(el,ax)){
        if(ax==="x") return;
        const top=el.scrollTop<=0, bottom=el.scrollTop+el.clientHeight>=el.scrollHeight-1;
        if((dy>0&&top)||(dy<0&&bottom)) e.preventDefault();
        return;
      }
    }
    e.preventDefault();
  },{passive:false});
})();

  const all=(S.tenants||[]).map(t=>({ t, u:unitOfTenant(t) }));
  const cur=all.filter(x=>x.u), past=all.filter(x=>!x.u);
  const f=ui.tFilter||"current", tb=ui.tBld&&BUILDINGS[ui.tBld]?ui.tBld:"all";
  const bOf=x=>x.u?x.u.b:(((x.t.stays||[]).slice(-1)[0])||{}).b;
  const show=(f==="current"?cur:f==="past"?past:all).filter(x=>tb==="all"||bOf(x)===tb).slice().sort((a,b)=>{

// Newest payment first; a cash payment with no date sorts by the month it was for.
// One payment entry can hold rent + electricity + charges; the list shows each part on its own row.
function payParts(p){ if(!hasParts(p)) return [["rent","Rent",+p.amount||0]]; const out=[]; const r=rentPart(p); if(r) out.push(["rent","Rent",r]); if(+p.elec) out.push(["elec","Electricity",+p.elec]); (p.charges||[]).forEach(c=>out.push(["oth",c.name||(chargeById(c.id)||{}).name||"Other",+c.amount||0])); return out.length?out:[["rent","Rent",+p.amount||0]]; }
function payTags(p){ const t=[]; const r=rentPart(p); if(!hasParts(p)) t.push(["rent","Rent"]); else { if(r) t.push(["rent","Rent "+money(r)]); if(+p.elec) t.push(["elec","Electricity "+money(p.elec)]); (p.charges||[]).forEach(c=>t.push(["oth",(c.name||(chargeById(c.id)||{}).name||"Other")+" "+money(c.amount)])); }
  return `<div>${t.map(([k,l])=>`<span class="ptag pt-${k}">${esc(l)}</span>`).join("")}</div>`; }
// Payment history split into Rent and Electricity (plus Other charges if any), newest month first, with the date each part was paid.
function payHistory(list){
  const sec={rent:{},elec:{},oth:{}};
  list.forEach(p=>{ payParts(p).forEach(([k,lab,amt])=>{ if(!amt) return; const key=k==="oth"?p.month+"|"+lab:p.month; const m=sec[k][key]=sec[k][key]||{month:p.month,label:lab,items:[]}; m.items.push({p,amt}); }); });
  const table=(title,o,showLabel)=>{ const rows=Object.values(o).sort((a,b)=>b.month.localeCompare(a.month)||String(a.label).localeCompare(String(b.label))); if(!rows.length) return "";
    const tot=rows.reduce((s,r)=>s+r.items.reduce((x,i)=>x+i.amt,0),0);
    return `<div class="box"><div style="padding:10px 14px;font-weight:700;background:var(--sunk);border-bottom:1px solid var(--line)">${title}</div><div class="tscroll"><table class="table cards"><thead><tr><th>Month</th><th>Paid on</th><th class="num">Amount</th></tr></thead><tbody>
    ${rows.map(r=>{ const its=r.items.slice().sort((a,b)=>payKey(a.p).localeCompare(payKey(b.p))); return `<tr><td style="white-space:nowrap;vertical-align:top"><b>${esc(monthLabel(r.month))}</b>${showLabel?`<div class="small muted">${esc(r.label)}</div>`:""}</td><td style="vertical-align:top">${its.map(i=>`<div style="white-space:nowrap">${pDate(i.p,1)}${i.p.mode?` <span class="small muted">· ${esc(i.p.mode)}</span>`:""}</div>`).join("")}</td><td class="num" style="vertical-align:top">${its.map(i=>`<div><b>${money(i.amt)}</b></div>`).join("")}${its.length>1?`<div class="small muted">Total ${money(its.reduce((s,i)=>s+i.amt,0))}</div>`:""}</td></tr>`; }).join("")}
    <tr><td colspan="2"><b>Total</b></td><td class="num"><b>${money(tot)}</b></td></tr></tbody></table></div></div>`; };
  return table("Rent",sec.rent)+table("Electricity",sec.elec)+table("Other charges",sec.oth,true);
}

let closeT=null;
const reducedMotion = () => !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
function closeDrawer(){
  ui.drawer=null; const root=$("drawer-root"), sc=root.querySelector(".scrim"), dr=root.querySelector(".drawer");
  if(!sc||!dr){ root.innerHTML=""; return; }
  sc.classList.add("closing","off"); dr.classList.remove("dragging"); dr.style.transform=""; dr.classList.add("off");
  clearTimeout(closeT); closeT=setTimeout(()=>{ if(!ui.drawer) root.innerHTML=""; }, reducedMotion()?220:440);
}
const head=(t,s)=>`<div class="d-head"><div><h2>${t}</h2>${s?`<div class="muted small">${s}</div>`:""}</div><button class="close" type="button" data-action="close" aria-label="Close">×</button></div>`;
// drag the panel to the right to close it; it follows the finger 1:1 and keeps the throw's speed
function attachSwipe(dr){
  let x0=0,y0=0,t0=0,on=false,lock=null,lastX=0,lastT=0,v=0;
  dr.addEventListener("pointerdown",e=>{ if(e.pointerType==="mouse") return; if(e.target.closest("input,select,textarea,.tscroll,.tabs,canvas")) return;
    x0=lastX=e.clientX; y0=e.clientY; t0=lastT=performance.now(); on=true; lock=null; v=0; },{passive:true});
  dr.addEventListener("pointermove",e=>{ if(!on) return; const dx=e.clientX-x0, dy=e.clientY-y0;
    if(lock===null){ if(Math.abs(dx)<10&&Math.abs(dy)<10) return; lock=Math.abs(dx)>Math.abs(dy)*1.2&&dx>0?"x":"y"; if(lock==="x"){ dr.classList.add("dragging"); try{ dr.setPointerCapture(e.pointerId); }catch(_){} } }
    if(lock!=="x") return;
    const now=performance.now(); v=(e.clientX-lastX)/Math.max(1,now-lastT); lastX=e.clientX; lastT=now;
    const x=dx>0?dx:dx*0.2; dr.style.transform=`translateX(${x}px)`; });
  const end=e=>{ if(!on) return; on=false; if(lock!=="x") return; const dx=(e.clientX||lastX)-x0;
    dr.classList.remove("dragging");
    if(dx>dr.offsetWidth*0.33||v>0.45){ closeDrawer(); } else { dr.style.transform=""; } };
  dr.addEventListener("pointerup",end); dr.addEventListener("pointercancel",end);
}
function dVersions(){
  return `${head("App versions","You are on Version "+APP_VERSION)}
  <div class="list">${VERSIONS.slice().reverse().map(([n,dt,t])=>`<div class="li"><div class="main"><div class="t">Version ${n}${n===APP_VERSION?' <span class="pill p-paid" style="margin-left:6px">Current</span>':""}</div><div class="s" style="white-space:normal">${esc(dt)} · ${esc(t)}</div></div></div>`).join("")}</div>`;

function renderDrawer(){
  const d=ui.drawer; if(!d){ $("drawer-root").innerHTML=""; return; }
  const fn={more:dMore,versions:dVersions,tenant:dTenant,transfer:dTransfer,room:dRoom,bijli:dBijli,unit:dUnit,"unit-form":dUnitForm,pay:dPay,payedit:dPayEdit,bill:dBill,sendbills:dSendBills,receipt:dReceipt,charge:dCharge,notes:dNotes,bldg:dBldg,expense:dExpense,moveout:dMoveout,settle:dSettle}[d.type];
  const html=fn?fn(d):null; if(html===null){ closeDrawer(); return; }
  const prev=$("drawer-root").querySelector(".drawer"); const st=prev?prev.scrollTop:0;
  const prevScrim=$("drawer-root").querySelector(".scrim"), wasClosing=!!(prevScrim&&prevScrim.classList.contains("closing"));
  const entering=!prev||wasClosing; let fromX=null;

  clearTimeout(closeT);
  // keep typed values in an open form when re-rendering
  const keepVals = d.keep && prev ? Array.from(prev.querySelectorAll("input[id],select[id],textarea[id]")).filter(e=>e.type!=="file").map(e=>[e.id, e.type==="checkbox"||e.type==="radio"?e.checked:e.value, e.type]) : null;
  $("drawer-root").innerHTML=`<div class="scrim${entering?" off":""}" data-action="scrim"><div class="drawer${entering&&fromX==null?" off":""}" role="dialog" aria-modal="true">${html}</div></div>`;
  const dr=$("drawer-root").querySelector(".drawer");
  if(entering){ const sc=dr.parentNode;
    if(fromX!=null){ dr.classList.add("dragging"); dr.style.transform=`translateX(${fromX}px)`; }
    void dr.offsetWidth; // start from the current place, then spring in
    requestAnimationFrame(()=>{ sc.classList.remove("off"); dr.classList.remove("dragging"); dr.style.transform=""; dr.classList.remove("off"); }); }
  /* centred popups close with ×, Esc, Back or a tap outside */
  if(d.keep){ dr.scrollTop=st; if(keepVals && d.type!=="unit") keepVals.forEach(([id,v,t])=>{ const e=document.getElementById(id); if(!e) return; if(t==="checkbox"||t==="radio") e.checked=v; else e.value=v; }); }
  d.keep=false;
  hydrateThumbs();
}

function duesList(u){
  const items=[]; if(!u||u.vacant) return items;
  const start=u.startMonth&&u.startMonth<=CUR?u.startMonth:CUR, from=start<shiftMonth(CUR,-24)?shiftMonth(CUR,-24):start;
  monthsBetween(from,CUR).forEach(m=>{ if(!movedInBy(u,m)) return;
    const rd=rentDue(u,m); if(rd>0) items.push({ k:"r_"+m, kind:"rent", ym:m, label:"Rent · "+monthLabel(m), due:rd });
    const ed=elecDue(u,m); if(ed>0) items.push({ k:"e_"+m, kind:"elec", ym:m, label:"Electricity · "+elecShort(u.b,m), due:ed }); });
  chargesOf(u,tenantById(u.tenantId)).forEach(c=>{ const b=chargeBal(c); if(b>0) items.push({ k:"c_"+c.id, kind:"charge", id:c.id, ym:CUR, label:c.name+(c.date?" · "+shortDate(c.date):""), due:b }); });
  const nx=shiftMonth(CUR,1);
  { const a=rentFor(u,nx)-rentPaidFor(u,nx); if(a>0) items.push({ k:"r_"+nx, kind:"rent", ym:nx, label:"Rent · "+monthLabel(nx)+" (advance)", due:a, adv:true }); }
  return items;
}

const payTicks_ = () => Array.from(document.querySelectorAll('#p-dues input[data-pk]'));
let PAYMAN=false;   // true once the user has ticked or unticked something by hand
// Share the amount over the ticked items, oldest first. Extra money goes to next month's rent.
function allocPay(){
  const ins=payTicks_(), amtEl=$("p-amount"); if(!ins.length) return;
  let amt=Math.round(+((amtEl||{}).value)||0); const ticked=ins.filter(x=>x.checked);
  if(!amt && ticked.length){ amt=ticked.reduce((s,x)=>s+(+x.dataset.due||0),0); if(amtEl) amtEl.value=amt; }
  let left=amt; ins.forEach(x=>{ let v=0; if(x.checked){ v=Math.min(left,+x.dataset.due||0); left-=v; } $("pv-"+x.dataset.pk).value=v; const t=$("pa-"+x.dataset.pk); if(t) t.textContent=x.checked?(v<(+x.dataset.due)?money(v)+" of "+money(x.dataset.due):money(v)):""; });
  let extra=0; if(left>0){ const adv=ins.find(x=>x.dataset.adv==="1")||ins[ins.length-1]; const hv=$("pv-"+adv.dataset.pk); hv.value=(+hv.value||0)+left; extra=left; }
  const zero=ticked.filter(x=>!(+$("pv-"+x.dataset.pk).value>0)).length;
  const short=ticked.filter(x=>x.dataset.adv!=="1").reduce((s,x)=>s+Math.max(0,(+x.dataset.due||0)-(+$("pv-"+x.dataset.pk).value||0)),0);
  const adv=ins.filter(x=>x.dataset.adv==="1").reduce((s,x)=>s+(+$("pv-"+x.dataset.pk).value||0),0), msg=$("p-sum"), tot=$("p-total");
  if(tot) tot.textContent=money(amt);
  if(msg){ msg.className="small "+(zero?"ocr-err":short?"":"ocr-ok");
    msg.textContent=!amt?"Type the amount, then tick what it is for.":zero?`${zero} ticked item${zero>1?"s get":" gets"} nothing. Raise the amount or untick ${zero>1?"them":"it"}.`:short?`${money(short)} short · the last ticked item stays part paid`:adv?`${money(adv)} goes to next month's rent (advance)`:"Amount matches the ticked items"; }
}
// Typing an amount ticks the oldest items until the money runs out.
function spreadAmount(total){
  if(PAYMAN){ allocPay(); return; }
  const amt=Math.round(+total||0); let left=amt;
  payTicks_().forEach(x=>{ x.checked=left>0; left-=(+x.dataset.due||0); });
  allocPay();
}
function updatePayTotal(){ allocPay(); }

  return upto;
}

function meterCalc(f){
  const total=+(f.querySelector("#mb-total")||{}).value||0, rows=[];
  f.querySelectorAll("[data-mrow]").forEach(r=>{ const id=r.dataset.mrow, g=x=>f.querySelector("#"+x+"-"+id);
    let units=null; if(g("mo").checked){ g("mui").hidden=false; const v=g("mui").value; units=v===""?null:Math.max(0,+v||0); } else { g("mui").hidden=true; const a=g("mr").value, b=g("mp").value; const mo=r.dataset.mcOld; units=(a!==""&&b!=="")?(mo!=null?Math.max(0,+mo-(+b))+Math.max(0,+a-(+r.dataset.mcNew||0)):Math.max(0,+a-(+b))):null; }
    const mk=g("mk"), unk=!!(mk&&mk.checked);
    rows.push({ id, units, bill:r.dataset.bill==="1", unk }); });
  const counted=r=>(r.bill||r.unk)&&r.units>0;
  const tu=rows.filter(counted).reduce((s,r)=>s+r.units,0), rate=tu>0&&total>0?total/tu:0;
  rows.forEach(r=>{ r.amount=counted(r)&&rate?Math.round(r.units*rate):0; });
  const unkAmt=rows.filter(r=>r.unk).reduce((s,r)=>s+r.amount,0);
  return { total, tu, rate, rows, unkAmt };
}
function updateMeterCalc(){
  const f=document.querySelector('form[data-form="bijli"][data-sub]'); if(!f) return; const c=meterCalc(f);
  c.rows.forEach(r=>{ const u=$("mu-"+r.id); if(u) u.textContent=r.units==null?"—":(+r.units.toFixed(2)); const b=$("mb-"+r.id); if(b) b.textContent=r.units==null||(!r.bill&&!r.unk)?"—":money(r.amount); });
  const box=$("mcalc"); if(box) box.innerHTML=`<div class="kv"><span>Units counted</span><b>${+c.tu.toFixed(2)}</b></div><div class="kv"><span>Rate per unit</span><b>${c.rate?"₹"+c.rate.toFixed(2):"—"}</b></div><div class="kv"><span>Billed to tenants</span><b>${money(c.rows.filter(r=>r.bill).reduce((s,r)=>s+r.amount,0))}</b></div>${c.unkAmt?`<div class="kv"><span>Unknown · not collected</span><b>${money(c.unkAmt)}</b></div>`:""}`;
}

function readAsDataURL(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsDataURL(file); }); }
async function compressImage(file,max=1600,q=.78){
  const url=await readAsDataURL(file);
  return new Promise(res=>{ const img=new Image(); img.onload=()=>{ const s=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext("2d").drawImage(img,0,0,c.width,c.height); try{ res(c.toDataURL("image/jpeg",q)); }catch(_){ res(url); } }; img.onerror=()=>res(url); img.src=url; });
}
async function makeThumb(dataUrl){ return new Promise(res=>{ const img=new Image(); img.onload=()=>{ const s=Math.min(1,120/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext("2d").drawImage(img,0,0,c.width,c.height); try{ res(c.toDataURL("image/jpeg",.7)); }catch(_){ res(""); } }; img.onerror=()=>res(""); img.src=dataUrl; }); }
async function uploadDataURL(name,type,dataUrl,folder){
  const b64=dataUrl.split(",")[1];
  const r=await call("saveFile", name, type, b64, folder);
  fileCache[r.id]={ name, type, data:dataUrl };
  return r.id;
}
async function storeFile(file,folder){
  const isImg=(file.type||"").startsWith("image/");
  const data=isImg?await compressImage(file):await readAsDataURL(file);
  const type=isImg?"image/jpeg":(file.type||"application/pdf");
  const name=(file.name||"file").replace(/\.[^.]+$/,"")+(isImg?".jpg":".pdf");
  const id=await uploadDataURL(name,type,data,folder||"Documents");
  return { id, type, thumb: isImg ? await makeThumb(data) : "" };
}
async function getFile(id){ if(fileCache[id]) return fileCache[id]; const r=await call("getFile",id); if(r) fileCache[id]=r; return r; }
function delFile(id){ if(id) call("deleteFile",id).catch(()=>{}); }

let tessLoading=null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve();

const MONTHS={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function parseUPI(raw){
  const t=raw.replace(/\r/g,"").replace(/[|]/g," ");
  const lines=t.split("\n").map(s=>s.trim()).filter(Boolean);
  const out={};
  // amount
  const num=s=>parseFloat(s.replace(/,/g,""));
  let m=t.match(/(?:₹|\bRs\.?|\bINR)\s*([0-9]{1,3}(?:,[0-9]{2,3})+(?:\.[0-9]{1,2})?|[0-9]+(?:\.[0-9]{1,2})?)/i);
  if(m) out.amount=num(m[1]);
  if(!out.amount){ for(const l of lines){ const mm=l.match(/^[^0-9a-z]{0,2}\s*([0-9]{1,3}(?:,[0-9]{2,3})+|[0-9]{3,6})(?:\.[0-9]{1,2})?$/i); if(mm){ out.amount=num(mm[1]); break; } } }
  // transaction id
  const flat=t.replace(/\n/g," ");
  const pats=[/UPI\s*(?:transaction|txn|ref(?:erence)?)\s*(?:id|no\.?|number)?\s*[:\-]?\s*([0-9][0-9 ]{10,16}[0-9])/i,
              /\bUTR\s*(?:no\.?|number)?\s*[:\-]?\s*([0-9][0-9 ]{10,16}[0-9])/i,
              /(?:transaction|txn|ref)\s*(?:id|no\.?)\s*[:\-]?\s*([A-Z0-9]{10,35})/i];
  for(const p of pats){ const mm=flat.match(p); if(mm){ const v=mm[1].replace(/\s/g,""); if(/^[0-9]+$/.test(v)?v.length===12:v.length>=10){ out.txnId=v; break; } } }
  if(!out.txnId){ const mm=flat.match(/\b([0-9]{4}\s?[0-9]{4}\s?[0-9]{4})\b/); if(mm) out.txnId=mm[1].replace(/\s/g,""); }
  // date
  let d=flat.match(/\b(\d{1,2})(?:st|nd|rd|th)?\s*(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?,?\s*(\d{4})/i);
  if(d) out.date=d[3]+"-"+pad(MONTHS[d[2].toLowerCase()])+"-"+pad(+d[1]);
  if(!out.date){ d=flat.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s*(\d{1,2}),?\s*(\d{4})/i); if(d) out.date=d[3]+"-"+pad(MONTHS[d[1].toLowerCase()])+"-"+pad(+d[2]); }

  const low=flat.toLowerCase(); let best=null,bs=0,tie=false;
  S.units.filter(u=>!u.vacant&&u.tenant).forEach(u=>{ const parts=u.tenant.toLowerCase().split(/\s+/).filter(w=>w.length>=3); let sc=0;
    if(low.includes(u.tenant.toLowerCase())) sc=5; else { if(parts[0]&&low.includes(parts[0])) sc+=3; if(parts.length>1&&low.includes(parts[parts.length-1])) sc+=1; }

}

/* ================= Aadhaar address reading ================= */
function parseAadhaarAddr(raw){
  const junk=/uidai|help@|www\.|aadhaar|unique identification|government of india|authority of india|\bvid\b|1947|1800|p\.?o\.? box|bengaluru-?560 ?001/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n").map(x=>x.replace(/[^A-Za-z0-9,.\-\/:#() ]/g," ").replace(/\s+/g," ").trim()).filter(x=>x.length>1);
  lines=lines.filter(x=>!junk.test(x) && !/^\d{4} ?\d{4} ?\d{4}$/.test(x.replace(/\s/g," ")) && (x.match(/[A-Za-z]/g)||[]).length>=2);
  let start=lines.findIndex(x=>/\baddress\b/i.test(x)), out=[];
  if(start>=0){ const first=lines[start].replace(/^.*?\baddress\b\s*[:;.]?\s*/i,""); if(first) out.push(first);
    for(let i=start+1;i<lines.length&&out.length<8;i++){ out.push(lines[i]); if(/\b\d{6}\b/.test(lines[i])) break; } }
  else { const pin=lines.findIndex(x=>/\b\d{6}\b/.test(x)); if(pin<0) return ""; out=lines.slice(Math.max(0,pin-4),pin+1); }
  let a=out.join(", ").replace(/\s*,\s*,+/g,", ").replace(/\s+,/g,",").replace(/,\s*$/,"");
  a=a.replace(/^\s*[CSDW]\s*[\/.]?\s*O\s*[:.\-]?\s*[^,]*,\s*/i,"");   // drop "S/O: father's name,"
  const pm=a.match(/^(.*?\b\d{6}\b)/); if(pm) a=pm[1];
  a=a.replace(/\s{2,}/g," ").trim();
  return a.length>=12 && /[A-Za-z]{3}/.test(a) ? a : "";
}
async function aadhaarAddress(file,target){
  const hint=(m,cls)=>{ const h=$(target+"-ocr"); if(h){ h.className=cls||"hint"; h.innerHTML=m; } };
  hint("Reading address from Aadhaar…");
  try{

    const r=await Tesseract.recognize(file,"eng",{ logger:x=>{ if(x.status==="recognizing text") hint("Reading address from Aadhaar… "+Math.round((x.progress||0)*100)+"%"); } });
    const a=parseAadhaarAddr(r.data.text||""), ta=$(target); if(!ta) return;
    if(!a){ hint("Couldn't read the address from the photo. Please type it.","small ocr-err"); return; }
    if(!ta.value.trim()){ ta.value=a; ta.classList.add("filled"); hint("Filled from Aadhaar. Please check it once.","small ocr-ok"); }

  }catch(_){ hint("Couldn't read the address. Please type it.","small ocr-err"); }
}

}

function billInfo(u,ym){

  const charges=chargesOf(u,t).map(c=>({ name:c.name, bal:chargeBal(c) })).filter(c=>c.bal>0), cT=charges.reduce((s,c)=>s+c.bal,0);

    name:u.tenant||"", flat:u.name, bld:bname(u.b), place:(BUILDINGS[u.b]||{}).place||"", per:elecShort(u.b,ym), due:dueDateOf(u,ym) };

function billText(i){ const L=[`Namaste ${i.name}, rent bill for ${monthLabel(i.ym,true)} (${i.bld}, flat ${i.flat}).`,""];

  i.charges.forEach(c=>L.push(`*${c.name}: ${money(c.bal)}*`));
  L.push(i.total>0?`*Total to pay: ${money(i.total)}*`:"*Nothing due right now. Thank you.*","",`UPI: ${PAY_UPI}`,`For assistance: ${ASSIST_PHONE}`,"","_This is a system-generated message._"); return L.join("\n"); }

  return `<button class="${cls||"btn"}" type="button" data-action="ask" data-what="${what}" data-id="${esc(id)}">${label}</button>`;
}

  if(ev.target.closest("[data-noopen]")) return;

  const innerAct = el => { const a=ev.target.closest("[data-action]"); return !!(a && el.contains(a) && a!==el); };
  const tn=ev.target.closest("[data-tenant]"); if(tn && !innerAct(tn)){ openDrawer({type:"tenant",id:tn.dataset.tenant}); return; }

    if(!fd.from||!(r>0)){ toast("Enter the month and the new rent."); return; }
    if(u.startMonth && fd.from<u.startMonth){ toast("That month is before this tenant's rent started."); return; }
    u.rentChanges=(u.rentChanges||[]).filter(c=>c.from!==fd.from); u.rentChanges.push({id:uid(),from:fd.from,rent:r});
    ui.drawer.addChange=false; commit("Rent increase saved: "+money(r)+" from "+monthLabel(fd.from)); return;
  }
  if(kind==="bijli" && f.dataset.sub){
    const k=f.dataset.b, ym=ui.month, c=meterCalc(f);
    S.meta.elecBill=S.meta.elecBill||{}; S.meta.elecBill[k]=S.meta.elecBill[k]||{};
    if(c.total>0) S.meta.elecBill[k][ym]=c.total; else delete S.meta.elecBill[k][ym];
    let n=0;
    S.units.filter(u=>u.b===k).forEach(u=>{
      const r=c.rows.find(x=>x.id===u.id); if(!r) return;
      u.meter=u.meter||{}; u.unitsOv=u.unitsOv||{}; u.bijli=u.bijli||{}; u.elecPaid=u.elecPaid||{};
      const mp=fd["mp_"+u.id], auto=meterPrevAuto(u,ym); u.meterOld=u.meterOld||{};
      if(mp!==undefined&&mp!==""){ if(auto==null&&u.meterStart==null&&!Object.keys(u.meter).length){ u.meterStart=+mp; u.meterStartYm=ym; delete u.meterOld[ym]; } else if(auto!=null&&+mp===auto) delete u.meterOld[ym]; else u.meterOld[ym]=+mp; } else delete u.meterOld[ym];
      const mr=fd["mr_"+u.id]; if(mr!==undefined&&mr!=="") u.meter[ym]=+mr; else delete u.meter[ym];
      u.unknownOcc=u.unknownOcc||{}; u.unknownElec=u.unknownElec||{};
      if(r.unk){ u.unknownOcc[ym]=true; u.unknownElec[ym]=r.amount; } else { delete u.unknownOcc[ym]; delete u.unknownElec[ym]; }
      if(fd["mo_"+u.id]&&fd["mui_"+u.id]!==undefined&&fd["mui_"+u.id]!=="") u.unitsOv[ym]=+fd["mui_"+u.id]; else delete u.unitsOv[ym];
      if(r.bill&&r.amount>0){ u.bijli[ym]=r.amount; n++; }
      else if(!selfElec(u,ym)){ delete u.bijli[ym]; delete u.elecPaid[ym]; }
    });
    commit(c.rate?`Electricity saved · ₹${c.rate.toFixed(2)}/unit · ${n} flat${n===1?"":"s"}`:"Readings saved");
    if(c.rate){ openDrawer({type:"sendbills",b:k}); }
    else closeDrawer();
    return;
  }
  if(kind==="bijli"){
    let n=0; S.units.filter(u=>u.b===f.dataset.b&&!vacantIn(u,ui.month)&&!selfElec(u,ui.month)).forEach(u=>{ const v=+fd["bj_"+u.id]||0; u.bijli=u.bijli||{}; u.elecPaid=u.elecPaid||{}; if(v>0){ u.bijli[ui.month]=v; n++; } else { delete u.bijli[ui.month]; delete u.elecPaid[ui.month]; } });
    commit("Electricity saved for "+n+" flat"+(n===1?"":"s"));
    if(n){ const k=f.dataset.b; openDrawer({type:"sendbills",b:k}); }
    else closeDrawer();
    return;
  }
  if(kind==="expense"){
    const amount=+fd.amount; if(!(amount>0)){ toast("Enter the amount."); return; }
    const id=f.dataset.id; const data={ id:id||uid(), by:ME?ME.name:"", b:fd.b||BKEYS[0], category:fd.category||"Other", amount, date:fd.date, note:(fd.note||"").trim() };
    if(id) S.expenses=S.expenses.map(e=>e.id===id?data:e); else S.expenses.push(data);
    if(data.date.slice(0,7)!==ui.month) ui.month=data.date.slice(0,7);
    closeDrawer(); commit(id?"Saved":"Expense added"); return;
  }

  if(kind==="moveout"){
    const u=unitById(f.dataset.id); if(!u) return;
    const c=settleCalc(fd.deposit,+f.dataset.dues,!!fd.use,fd.deductions);
    const x={ id:uid(), unitId:u.id, unitName:u.name, b:u.b, tenant:u.tenant, phone:u.phone, moveIn:u.moveIn, moveOut:fd.moveOut||todayISO(), deposit:c.deposit, dues:c.dues, fromDep:c.fromDep, deductions:c.deductions, deductNote:(fd.deductNote||"").trim(), refund:c.refund, stillOwes:c.stillOwes, created:Date.now() };
    S.settlements.push(x);
    const tp=tenantById(u.tenantId);
    if(tp){ const end=ym7(x.moveOut), cs=(tp.stays||[]).find(y=>!y.to&&y.unitId===u.id);
      if(cs){ cs.months=snapshotStay(u,u.startMonth,end<CUR?end:CUR); cs.to=end; cs.toDate=x.moveOut; cs.closedBy="moveout"; }
      tp.settlementIds=(tp.settlementIds||[]).concat([x.id]); tp.leftOn=x.moveOut; x.tenantId=tp.id; }
    Object.assign(u,{ tenantId:"", discount:false, selfElecFrom:"", payAfter:false });
    Object.assign(u,{ vacant:true, tenant:"", phone:"", deposit:"", startMonth:"", moveIn:"", agreementStart:"", agreementEnd:"", rentChanges:[], accountId:"", members:"", permAddress:"" }); ui.tenants=null;
    ui.drawer={type:"settle",sid:x.id}; commit("Settlement saved. Flat is now vacant."); return;
  }
});

/* ================= boot ================= */
(async function boot(){
  if(!HAS_GAS && location.protocol==="file:" && !window.__viaApi){ $("view").innerHTML=`<div class="banner">Open Rent Tracker from its web link. This file can't save data on its own.</div>`; return; }
  if(!TOKEN){ showLogin(); return; }
  try{ await startSession(); }
  catch(e){ if(!ui.locked) $("view").innerHTML=`<div class="banner">Couldn't load your data from Google Drive. Check your internet and reload the page.<br><span class="small muted">${esc(errMsg(e))}</span></div>`; }
})();
})();
</script>
</body>
</html>
